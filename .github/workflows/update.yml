name: 대전 한눈에 갱신

on:
  schedule:
    - cron: "7,37 * * * *"   # 30분마다 (GitHub 사정에 따라 몇 분~수십 분 늦을 수 있음)
  workflow_dispatch: {}       # Actions 화면에서 '지금 실행' 가능
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 기사 모으기
        run: python collect.py
      - name: 키워드 기록 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || (git commit -m "키워드 기록 갱신" && git push)
      - name: 웹 페이지 준비
        run: mkdir -p site && cp dashboard.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
